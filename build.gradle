plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.1.0'
group = 'com.fieldofmemories'
base { archivesName = 'FieldOfMemories' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { fieldofmemories { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.0' }

 tasks.named('processResources').configure {
    var replaceProperties = [minecraft_version: '1.20.1', forge_version: '47.3.0', mod_id: 'fieldofmemories', mod_name: 'Field of Memories', mod_version: project.version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}
jar.finalizedBy('reobfJar')
