name: Build Forge Mod
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract supplied asset archive
        run: |
          git fetch origin assets-library
          git show origin/assets-library:WWW.zip > /tmp/WWW.zip
          mkdir -p /tmp/WWW-assets
          unzip -q /tmp/WWW.zip -d /tmp/WWW-assets
          cd /tmp
          zip -qr /tmp/WWW-assets-extracted.zip WWW-assets
      - name: Upload extracted asset archive
        uses: actions/upload-artifact@v4
        with:
          name: WWW-assets-extracted
          path: /tmp/WWW-assets-extracted.zip
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build mod
        run: gradle build
      - name: Show built JAR
        run: ls -lah build/libs/
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: FieldOfMemories-1.20.1-Forge
          path: build/libs/*.jar
          if-no-files-found: error
