name: Build Forge Mod
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract supplied asset archive
        run: |
          git fetch origin assets-library
          git show origin/assets-library:WWW.zip > /tmp/WWW.zip
          git show origin/assets-library:converted-audio.zip > /tmp/converted-audio.zip
          mkdir -p /tmp/converted-audio
          unzip -q /tmp/converted-audio.zip -d /tmp/converted-audio
          mkdir -p /tmp/WWW-assets
          unzip -q /tmp/WWW.zip -d /tmp/WWW-assets
          mkdir -p /tmp/HorrorSound
          if git cat-file -e origin/assets-library:HorrorSound.zip 2>/dev/null; then
            git show origin/assets-library:HorrorSound.zip > /tmp/HorrorSound.zip
            unzip -oq /tmp/HorrorSound.zip -d /tmp/HorrorSound
          fi
          cd /tmp
          zip -qr /tmp/WWW-assets-extracted.zip WWW-assets
      - name: Upload extracted asset archive
        uses: actions/upload-artifact@v4
        with:
          name: WWW-assets-extracted
          path: /tmp/WWW-assets-extracted.zip
          if-no-files-found: error
      - name: Import Blockbench camera and leaflet models
        run: |
          CAMERA_DIR=/tmp/WWW-assets/WWW/Camera
          LEAFLET_FILE="$(find /tmp/WWW-assets/WWW -type f -name Cardboard.json -print -quit)"
          LEAFLET_DIR="$(dirname "$LEAFLET_FILE")"
          mkdir -p src/main/resources/assets/fieldofmemories/models/block
          mkdir -p src/main/resources/assets/fieldofmemories/models/item
          mkdir -p src/main/resources/assets/fieldofmemories/blockstates
          mkdir -p src/main/resources/assets/fieldofmemories/textures/item
          mkdir -p src/main/resources/assets/fieldofmemories/textures/block
          mkdir -p src/main/resources/assets/fieldofmemories/sounds
          HEARTBOUND_FILE="$(find /tmp/converted-audio -type f -name heatrbound.ogg -print -quit)"
          if [ -z "$HEARTBOUND_FILE" ]; then HEARTBOUND_FILE="$(find /tmp/converted-audio -type f -name heartbound.ogg -print -quit)"; fi
          SCREAMSOUL_FILE="$(find /tmp/converted-audio -type f -name screamsoul.ogg -print -quit)"
          test -n "$HEARTBOUND_FILE" && test -n "$SCREAMSOUL_FILE"
          cp "$HEARTBOUND_FILE" src/main/resources/assets/fieldofmemories/sounds/heartbound.ogg
          cp "$SCREAMSOUL_FILE" src/main/resources/assets/fieldofmemories/sounds/screamsoul.ogg
          if [ -f /tmp/HorrorSound/HorrorSound/ClockClock.ogg ]; then
            cp /tmp/HorrorSound/HorrorSound/ClockClock.ogg src/main/resources/assets/fieldofmemories/sounds/clock_clock.ogg
            cp /tmp/HorrorSound/HorrorSound/KidLaugh.ogg src/main/resources/assets/fieldofmemories/sounds/kid_laugh.ogg
            cp /tmp/HorrorSound/HorrorSound/HorrorPipi.ogg src/main/resources/assets/fieldofmemories/sounds/horror_pipi.ogg
             NIGHT2_FILE="$(find /tmp/HorrorSound -type f -name night2.ogg -print -quit)"
            NIGHT4_FILE="$(find /tmp/HorrorSound -type f -name night4.ogg -print -quit)"
            test -n "$NIGHT2_FILE" && test -n "$NIGHT4_FILE"
            cp "$NIGHT2_FILE" src/main/resources/assets/fieldofmemories/sounds/night_ambient_2.ogg
            cp "$NIGHT4_FILE" src/main/resources/assets/fieldofmemories/sounds/night_ambient_4.ogg
          fi
          cp "$CAMERA_DIR/VideoCameraOpen.png" src/main/resources/assets/fieldofmemories/textures/item/video_camera.png
          cp "$LEAFLET_DIR/cardboard.png" src/main/resources/assets/fieldofmemories/textures/block/tree_leaflet.png
          python3 - "$LEAFLET_FILE" <<'PY'
          import json, os, sys
          source = json.load(open(sys.argv[1], encoding="utf-8"))
          source["texture_size"] = [64, 64]
          source["textures"] = {
              "0": "fieldofmemories:block/tree_leaflet",
              "particle": "fieldofmemories:block/tree_leaflet"
          }
          source["render_type"] = "minecraft:cutout"
          root = "src/main/resources/assets/fieldofmemories"
          os.makedirs(os.path.join(root, "models", "block"), exist_ok=True)
          os.makedirs(os.path.join(root, "blockstates"), exist_ok=True)
          with open(os.path.join(root, "models", "block", "tree_leaflet.json"), "w", encoding="utf-8") as out:
              json.dump(source, out, separators=(",", ":"))
          variants = {}
          for facing, rotation in (("north", 0), ("east", 90), ("south", 180), ("west", 270)):
              variant = {"model": "fieldofmemories:block/tree_leaflet"}
              if rotation:
                  variant["y"] = rotation
              variants[f"facing={facing}"] = variant
          with open(os.path.join(root, "blockstates", "tree_leaflet.json"), "w", encoding="utf-8") as out:
              json.dump({"variants": variants}, out, separators=(",", ":"))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/fieldofmemories/models src/main/resources/assets/fieldofmemories/blockstates/tree_leaflet.json src/main/resources/assets/fieldofmemories/textures src/main/resources/assets/fieldofmemories/sounds
          if ! git diff --cached --quiet; then
            git commit -m "Import supplied camera and leaflet models [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build mod
        run: gradle build
      - name: Show built JAR
        run: ls -lah build/libs/
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: FieldOfMemories-1.20.1-Forge
          path: build/libs/*.jar
          if-no-files-found: error
